# Every threshold and path lives here (BLUEPRINT.md Sections 4 and 6).
# Starting values for the demo; none of them is a claim about upay policy.

project:
  name: SafeOrder
  seed: 42
  sandbox_banner_en: "Sandbox - synthetic data, no real money"
  sandbox_banner_bn: "স্যান্ডবক্স - কৃত্রিম ডেটা, কোনো আসল টাকা নয়"

paths:
  database: data/safeorder.db
  synthetic_dir: data/synthetic
  cases_dir: data/cases
  raw_dir: raw
  models_dir: models
  reports_dir: reports
  docs_dir: docs

rules:
  hold_period_hours: 72          # hold after delivery
  seller_response_deadline_hours: 48
  dispatch_deadline_hours: 72    # seller never dispatches before this -> DISPUTABLE
  max_appeals_per_party: 1
  trust:
    trusted_min: 70              # TRUSTED 70-100
    caution_min: 40              # CAUTION 40-69, HIGH_RISK 0-39
    limited_history_max_age_days: 14
    limited_history_min_orders: 10
    high_risk_requires_confirmation: true
    # Blueprint 6.2 hides every account younger than 14 days behind LIMITED_HISTORY, but every
    # simulated fake seller is that young, so the demo would never show HIGH_RISK (see DECISIONS.md).
    # A model score at or below this value still shows HIGH_RISK for limited-history sellers.
    # null = literal blueprint behaviour (never override).
    limited_history_override_max_score: 20
  routing:
    min_class_probability: 0.80
    high_amount_bdt: 5000
    repeat_claimant_count: 3
    repeat_claimant_window_days: 90
    always_human_classes: [INSUFFICIENT_EVIDENCE]

dispute:
  model: baseline                # baseline | transformer (P1)

api:
  base_path: /api
  cors_origins: ["http://localhost:5173"]
  demo_endpoints_enabled: true     # /api/sim/* and /api/demo/*; switch off outside the sandbox demo
  delivery_code_digits: 6          # sandbox codes are derived from the seed; not a security feature
  max_amount_bdt: 200000
  max_claim_chars: 2000
  max_evidence_chars: 4000
  max_note_chars: 2000
  search_limit: 10
  max_body_bytes: 65536            # larger request bodies are refused with 413
  rate_limit_per_minute: 240       # per client address; 0 switches the limit off (429 when exceeded)

# Synthetic seller generator (BLUEPRINT.md Section 8.2). Every number here is an assumption,
# not an observation of any real market. Ranges are [low, high].
generator:
  as_of: "2026-10-01T00:00:00"        # scoring moment; all orders happen before it
  n_sellers: 3000
  stats_window_days: [60, 90]          # days of daily stats per seller (or the account age)
  label_noise: 0.04                    # share of sellers whose is_high_risk label is flipped
  buyer_pool_size: 20000
  buyer_age_days: [30, 700]
  loyal_orders_per_buyer: 3            # average orders per returning buyer (shapes repeat_buyer_ratio)
  ticket_sigma: 0.3                    # spread of order amounts around the seller's typical ticket
  min_amount_bdt: 100
  amount_round_to: 10
  max_cashout_latency_min: 20160       # 14 days
  seeds:
    v1: 1001
    v2: 2002
  categories:                          # median order amount in BDT (assumption)
    clothing: 1200
    cosmetics: 700
    electronics: 4500
    household: 900
    food: 450
    shoes: 1800
    books: 400
    accessories: 600
  weekday_factors: [1.0, 1.0, 1.0, 1.05, 0.8, 0.85, 1.1]   # Monday..Sunday
  hour_weights: [1, 1, 1, 1, 1, 2, 3, 4, 5, 6, 6, 6, 6, 6, 6, 6, 7, 8, 9, 9, 8, 6, 4, 2]
  festival:                            # a synthetic spike, not tied to a real calendar date
    start: "2026-09-10"
    end: "2026-09-17"
    multiplier: 1.6
  shares:
    honest_established: 0.55
    honest_new: 0.15
    fake_burst: 0.12
    slow_scammer: 0.08
    collusive_ring: 0.05
    chronic_poor_service: 0.05
  archetypes:
    honest_established:
      age_days: [180, 900]
      orders_per_day: [0.4, 4.0]
      repeat_buyer_ratio: [0.25, 0.6]
      ticket_ratio: [0.7, 1.3]
      refund_rate: [0.01, 0.04]
      dispute_rate: [0.005, 0.02]
      cashout_median_min: [1500, 6000]
      cashout_sigma: 0.8
    honest_new:
      age_days: [3, 45]
      orders_per_day: [0.2, 2.0]
      repeat_buyer_ratio: [0.0, 0.15]
      ticket_ratio: [0.6, 1.4]
      refund_rate: [0.005, 0.03]
      dispute_rate: [0.0, 0.02]
      cashout_median_min: [1200, 5000]
      cashout_sigma: 0.9
      fast_cashout_prob: 0.12          # overlap with scammers: some honest new sellers cash out fast
      fast_cashout_median_min: [10, 60]
    fake_burst:
      age_days: [1, 10]
      burst_hours: [24, 72]
      burst_buyers: [20, 120]
      pre_burst_orders: [0, 3]
      ticket_ratio: [1.5, 3.0]
      refund_rate: [0.0, 0.02]
      dispute_rate: [0.02, 0.12]
      cashout_median_min: [3, 30]
      cashout_sigma: 0.6
      mild_prob: 0.2                   # overlap with honest sellers: a milder, harder-to-spot burst
      mild_burst_buyers: [10, 30]
      mild_ticket_ratio: [1.0, 1.5]
      mild_cashout_median_min: [60, 400]
    slow_scammer:
      honest_days: [30, 90]
      spike_days: [3, 7]
      silence_days: [0, 2]
      honest_orders_per_day: [0.4, 3.0]
      repeat_buyer_ratio: [0.1, 0.4]
      honest_ticket_ratio: [0.7, 1.3]
      honest_refund_rate: [0.01, 0.04]
      honest_dispute_rate: [0.005, 0.02]
      honest_cashout_median_min: [1500, 6000]
      spike_order_multiplier: [6, 15]
      spike_ticket_ratio: [2.0, 4.0]
      spike_refund_rate: [0.05, 0.15]
      spike_dispute_rate: [0.1, 0.3]
      spike_cashout_median_min: [10, 120]
      cashout_sigma: 0.8
      mild_prob: 0.2
      mild_spike_order_multiplier: [2, 4]
    collusive_ring:
      age_days: [20, 120]
      ring_size: [3, 6]
      ring_pool_buyers: [6, 14]
      ring_share: [0.85, 0.95]
      orders_per_day: [1.0, 4.0]
      ticket_ratio: [1.0, 1.6]
      refund_rate: [0.0, 0.02]
      dispute_rate: [0.0, 0.02]
      cashout_median_min: [120, 900]
      cashout_sigma: 0.7
    chronic_poor_service:              # hard negative: unreliable but not fraudulent
      age_days: [90, 600]
      orders_per_day: [0.8, 4.0]
      repeat_buyer_ratio: [0.15, 0.4]
      ticket_ratio: [0.7, 1.3]
      refund_rate: [0.08, 0.18]
      dispute_rate: [0.10, 0.25]
      cashout_median_min: [1500, 6000]
      cashout_sigma: 0.8
  v2:                                  # shifted test generator: roughly 20% parameter shifts
    shares:
      honest_established: 0.50
      honest_new: 0.20
      fake_burst: 0.10
      slow_scammer: 0.08
      collusive_ring: 0.05
      chronic_poor_service: 0.07
    scale:                             # dotted path under `archetypes` -> multiplier
      fake_burst.burst_buyers: 0.8
      fake_burst.ticket_ratio: 0.8
      fake_burst.cashout_median_min: 1.2
      fake_burst.mild_prob: 1.25
      honest_new.fast_cashout_prob: 1.25
      honest_new.orders_per_day: 1.2
      honest_established.orders_per_day: 0.8
      slow_scammer.spike_order_multiplier: 0.8
      collusive_ring.ring_share: 0.9
      chronic_poor_service.dispute_rate: 1.2

# Seller trust model (BLUEPRINT.md Section 9.1)
trust_model:
  version: trust_v1
  seed: 42
  split: {train: 0.6, validation: 0.2, calibration: 0.2}   # of generator v1; v2 is the test set
  lightgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 15
    min_child_samples: 20
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    early_stopping_rounds: 30
  calibration: platt             # Platt scaling: the calibration split is too small for isotonic
  # More refunds or disputes must never make a seller look safer. Without this constraint, one
  # extra refund and dispute raised the score of about a quarter of the sellers (see DECISIONS.md).
  monotone_increasing_risk: [refund_rate, dispute_rate]
  burst_ratio_floor: 1.0         # minimum daily average used as the burst-ratio denominator
  overlap_min_buyers: 5          # fewer buyers than this: shared_buyer_overlap is not meaningful
  reasons: {min: 2, max: 4, min_abs_contribution: 0.05}
  latency_budget_ms: 50
  eval: {target_fpr: 0.05, calibration_bins: 10, latency_samples: 300}

# Evidence analyzer (BLUEPRINT.md Section 9.3). Routing thresholds live under rules.routing.
analyzer:
  rules_version: rules_v1
  min_evidence_chars: 15
  min_evidence_words: 3
  late_report_hours: 48            # a dispute filed this long after delivery is flagged LATE_REPORT
  amount_tolerance: 0.01
  amount_bands_bdt: [1000, 2000, 5000, 10000]
  proof_keywords: [tracking, track, receipt, memo, consignment, booking, "ট্র্যাকিং", "রসিদ", "মেমো", "কনসাইনমেন্ট", "বুকিং", "ট্র্যাক"]
