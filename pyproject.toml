[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", ".venv", "kaggle", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "eval", "scripts"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_kaggle.py" = ["E501"]  # the notebook text is prose, not code
"scripts/build_docs.py" = ["E501"]  # the document templates are prose
"scripts/case_bank/*.py" = ["E501"]  # the case texts are data, not code
"scripts/make_cases.py" = ["E501"]
"eval/dispute_eval.py" = ["E501"]  # report text
"backend/tests/test_dispute_model.py" = ["E501"]  # Bangla test texts
"backend/tests/test_cases.py" = ["E501"]
"scripts/build_pitch.py" = ["E501"]  # document text
